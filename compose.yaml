name: enterprise-bi-demo

x-app: &app
  build: .
  image: enterprise-bi-backend:0.1.0
  networks: [internal]
  init: true
  environment: &app-env
    BI_DATABASE_URL: postgresql+psycopg://warehouse:${WAREHOUSE_PASSWORD:?Run scripts/configure_demo.py}@warehouse:5432/warehouse
    BI_API_KEY: ${BI_API_KEY:?Run scripts/configure_demo.py}
    BI_SOURCES_FILE: /app/config/sources.compose.yaml
    BI_ALLOWED_SOURCE_HOSTS: '["demo-sources"]'
    DEMO_1C_USER: demo
    DEMO_1C_PASSWORD: demo
  volumes:
    - ./config:/app/config:ro

services:
  warehouse:
    image: postgres:17.12
    networks: [internal]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/configure_demo.py}
      WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD:?Run scripts/configure_demo.py}
      METABASE_PASSWORD: ${METABASE_PASSWORD:?Run scripts/configure_demo.py}
      BI_READER_PASSWORD: ${BI_READER_PASSWORD:?Run scripts/configure_demo.py}
    volumes:
      - warehouse:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d postgres']
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *app
    command: [alembic, upgrade, head]
    depends_on:
      warehouse:
        condition: service_healthy

  demo-sources:
    <<: *app
    environment:
      DEMO_1C_USER: demo
      DEMO_1C_PASSWORD: demo
    command: [uvicorn, 'bi_backend.demo_sources:app', --host, 0.0.0.0, --port, '8010', --no-access-log]
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8010/health")']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    <<: *app
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health")']
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      migrate:
        condition: service_completed_successfully
      demo-sources:
        condition: service_healthy

  worker:
    <<: *app
    command: [python, -m, bi_backend.worker]
    depends_on:
      migrate:
        condition: service_completed_successfully
      demo-sources:
        condition: service_healthy

  metabase:
    image: metabase/metabase:v0.65.7
    networks: [internal]
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: warehouse
      MB_DB_PORT: '5432'
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_PASSWORD:?Run scripts/configure_demo.py}
      MB_ANON_TRACKING_ENABLED: 'false'
      MB_CHECK_FOR_UPDATES: 'false'
      MB_SITE_URL: http://localhost:3000
    healthcheck:
      test: [CMD, curl, --fail, --silent, 'http://127.0.0.1:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      migrate:
        condition: service_completed_successfully

  gateway:
    image: nginx@sha256:8eb04fe3b385090e9aa02961f77398ad09b6bf33ab07f6669a5bb7acce22c0d3
    networks: [internal, ingress]
    ports: ['127.0.0.1:8000:8000', '127.0.0.1:3000:3000']
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    security_opt: [no-new-privileges:true]
    depends_on:
      api:
        condition: service_healthy
      metabase:
        condition: service_healthy

networks:
  internal:
    internal: true
  ingress:
    driver: bridge
volumes:
  warehouse:
