name: backend
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.12
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: bi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d bi_test" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock
      - run: pip install --no-deps --no-build-isolation .
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python scripts/check_demo.py
      - run: pytest -q
        env:
          BI_TEST_POSTGRES_URL: postgresql+psycopg://postgres:test@localhost:5432/bi_test
