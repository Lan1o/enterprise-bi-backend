[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bi-backend"
version = "0.1.0"
description = "First vertical slice of a BI and data integration backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0.38,<2.1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.8,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "httpx>=0.28,<1",
  "PyYAML>=6,<7",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bi_backend = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
